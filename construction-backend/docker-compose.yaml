name: 'table-backend'

services:
  backend:
    image: table-backend:latest
    container_name: table-backend
    build:
      context: ./
      dockerfile: Dockerfile
      target: production
    restart: always
    tty: true
    stdin_open: true
    env_file: .env
    ports:
      - '8002:8000'
    volumes:
      - .:/app
    networks:
      - table

  database:
    image: postgres:18.6-alpine3.24
    container_name: table-database
    restart: always
    ports:
      - '8003:80'
    environment:
      - POSTGRES_PASSWORD="db_pass"
      - POSTGRES_USER="db_user"
      - POSTGRES_DB="db"
    volumes:
      - PG_DATA:/var/lib/postgresql
    networks:
      - table

  pgAdmin:
    image: dpage/pgadmin4
    container_name: table-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL:"admin@gmail.com"
      - PGADMIN_DEFAULT_PASSWORD:"admin"
    volumes:
      - PG_ADMIN:/var/lib/pgadmin
    restart: always
    ports:
      - '5433:5432'
    networks:
      - table

volumes:
  PG_ADMIN: {}
  PG_DATA: {}

networks:
  table:
    name: table-network
    external: true
